targets:
  dev:
    # For personal branch work - each developer gets isolated resources and schema
    # - Deployed resources get prefixed with 'dev_username_'
    # - Each developer uses their own schema (username)
    mode: production
    default: true
    workspace:
      host: https://dbc-d19b75b9-52f8.cloud.databricks.com
      root_path: /Workspace/Users/kbf1984@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: datasets
      schema: ${workspace.current_user.short_name}
      prefix: dev_${workspace.current_user.short_name}_
  
  main:
    # For main branch deployments - shared dev environment
    # - Prefix for shared workspace on resources
    # - Uses shared 'stage' schema
    mode: production
    workspace:
      host: https://dbc-d19b75b9-52f8.cloud.databricks.com
      root_path: /Workspace/Users/kbf1984@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: datasets
      schema: stage
      prefix: stage_
    permissions:
      - user_name: kbf1984@hotmail.com
        level: CAN_MANAGE
  
  prod:
    # Production environment
    mode: production
    workspace:
      host: https://dbc-d19b75b9-52f8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kbf1984@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kbf1984@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: datasets
      schema: prod
      prefix: ""
    permissions:
      - user_name: kbf1984@hotmail.com
        level: CAN_MANAGE