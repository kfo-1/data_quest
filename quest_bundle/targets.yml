targets:
  dev:
    # For personal branch work - each developer gets isolated resources and schema
    # - Deployed resources get prefixed with 'dev_username_'
    # - Each developer uses their own schema (username)
    mode: production
    default: true
    workspace:
      host: https://dbc-d19b75b9-52f8.cloud.databricks.com
      root_path: /Workspace/Users/kbf1984@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: datasets
      schema: ${workspace.current_user.short_name}
      prefix: dev_${workspace.current_user.short_name}_
