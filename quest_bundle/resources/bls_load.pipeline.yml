resources:
  pipelines:
    bls_load:
      name: ${var.prefix}bls_load
      libraries:
        - glob:
            include: ../src/bls_load/transformations/**
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: ../src/bls_load
      configuration:
        source_catalog: ${var.catalog}
        source_schema: ${var.schema}
